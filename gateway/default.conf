# AMBIENTE PROD
server{
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        proxy_pass http://fe-prod:80;
    }
    location /api/ {
        set $backend_upstream http://sio-backend:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
    }
}

