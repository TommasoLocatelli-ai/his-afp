<div class="flex flex-col gap-6">
  <his-ricerca-paziente
    (newPatientRequested)="onNewPatientRequest()"
    (noPatientFound)="onNoPatientFound()"
    (patientSelected)="onPatientSelected($event)"
  />

  @if (showForm()) {
    <div class="flex">
      <p-button
        (onClick)="onBackToSearch()"
        icon="pi pi-arrow-left"
        label="Indietro"
        severity="secondary"
        type="button"
        variant="outlined"
      />
    </div>
    <his-form-accettazione-pz [selectedPatient]="selectedPatient()" />
  } @else {
    <p-message severity="info" variant="simple">
      Il form viene mostrato quando selezioni un paziente dai risultati oppure clicchi "Nuovo Paziente".
    </p-message>
  }
</div>
